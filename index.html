
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゲームのカード落としちゃった</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #171717;
    color: white;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

#game {
    width: min(900px, 95vw);
    min-height: 600px;
    background: #303030;
    border: 3px solid #777;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
}

header {
    padding: 12px;
    background: #111;
    text-align: center;
    border-bottom: 2px solid #555;
}

header h1 {
    font-size: clamp(18px, 4vw, 28px);
    margin: 5px;
}

#scene {
    height: 360px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(#9fc7d9 0 55%, #555 55% 100%);
}

.window {
    position: absolute;
    top: 25px;
    left: 8%;
    width: 84%;
    height: 160px;
    background: linear-gradient(#a8d8ef, #e4f4fa);
    border: 12px solid #444;
    border-radius: 10px;
}

.window::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    height: 100%;
    border-left: 8px solid #444;
}

.seat {
    position: absolute;
    bottom: 30px;
    width: 42%;
    height: 100px;
    background: #365b72;
    border: 8px solid #233d4c;
    border-radius: 18px 18px 5px 5px;
}

.seat.left {
    left: 4%;
}

.seat.right {
    right: 4%;
}

.floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 35px;
    background: #292929;
}

.person {
    position: absolute;
    bottom: 110px;
    width: 90px;
    height: 145px;
    border-radius: 45px 45px 12px 12px;
    background: #222;
    display: none;
    transition: 0.3s;
}

.person::before {
    content: "";
    position: absolute;
    top: -55px;
    left: 15px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #e0b99b;
    border: 3px solid #222;
}

#man {
    left: 30%;
    background: #333;
}

#driver {
    right: 10%;
    background: #354b37;
}

#card {
    position: absolute;
    width: 70px;
    height: 100px;
    left: 48%;
    bottom: 145px;
    background: #e7dfb8;
    color: #222;
    border: 5px solid #b7a66e;
    border-radius: 7px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    cursor: pointer;
    transform: rotate(-10deg);
    transition: transform 0.6s, bottom 0.6s;
    z-index: 5;
}

#card:hover {
    filter: brightness(1.15);
}

#card.fallen {
    bottom: 12px;
    transform: rotate(75deg);
}

#card.hidden {
    display: none;
}

#dialogue {
    min-height: 145px;
    padding: 18px;
    background: #111;
    border-top: 2px solid #666;
}

#speaker {
    color: #f0d36a;
    font-weight: bold;
    margin-bottom: 10px;
}

#text {
    min-height: 50px;
    font-size: clamp(17px, 3vw, 23px);
    line-height: 1.6;
    white-space: pre-wrap;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px;
    justify-content: center;
    background: #222;
}

button {
    padding: 12px 22px;
    border: 0;
    border-radius: 7px;
    background: #e4c75c;
    color: #222;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ffe77b;
}

button:disabled {
    background: #666;
    color: #aaa;
    cursor: not-allowed;
}

#status {
    text-align: center;
    color: #aaa;
    padding: 8px;
    font-size: 13px;
}

.shake {
    animation: shake 0.35s;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-12px); }
    40% { transform: translateX(12px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
}

.flash {
    animation: flash 0.3s;
}

@keyframes flash {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(2); }
}
</style>
</head>

<body>
<div id="game">

    <header>
        <h1>ゲームのカード落としちゃった</h1>
    </header>

    <main id="scene">
        <div class="window"></div>

        <div class="person" id="man"></div>
        <div class="person" id="driver"></div>

        <div class="seat left"></div>
        <div class="seat right"></div>
        <div class="floor"></div>

        <div id="card" title="クリックしてカードを落とす">
            CARD
        </div>
    </main>

    <section id="dialogue">
        <div id="speaker">？？？</div>
        <div id="text">画面を操作してください。</div>
    </section>

    <div class="controls">
        <button id="next">次へ</button>
        <!--<button id="search">カードを探す</button>-->
        <button id="restart">最初から</button>
    </div>

    <!--<div id="status">カードをクリックすることもできます。</div>-->

</div>

<script>
const scenes = [
    {
        speaker: "男",
        text: "うわー！",
        action: () => showMan()
    },
    {
        speaker: "男",
        text: "どうか行かないで・・・",
        action: () => shake()
    },
    {
        speaker: "男",
        text: "あー！落としちゃった・・・",
        action: () => fallCard()
    },
    {
        speaker: "男",
        text: "ウワァァァァァァ・・・",
        action: () => shake()
    },
    {
        speaker: "男",
        text: "マアァァァァァァ・・・",
        action: () => shake()
    },
    {
        speaker: "男",
        text: "うぁー！落としたァー！",
        action: () => shake()
    },
    {
        speaker: "男",
        text: "ゲームのカード落としちゃった！！！",
        action: () => {
            fallCard();
            flash();
        }
    },
    {
        speaker: "運転手",
        text: "どうかぁ、しましたか？",
        action: () => showDriver()
    },
    {
        speaker: "男",
        text: "はい！（即答）　ゲームのカードを落としてす、しまったのですが！",
        action: () => shake()
    },
    {
        speaker: "運転手",
        text: "あ、それ後でほんじゃあ探しますから、あっと・・・車庫まで来てください。ね？\nちょっとも、大人しくしててくれる？",
        action: () => showDriver()
    },
    {
        speaker: "男",
        text: "ぁﾊﾝ・・・",
        action: () => shake()
    }
];

let index = -1;
let cardFound = false;

const scene = document.getElementById("scene");
const speaker = document.getElementById("speaker");
const text = document.getElementById("text");
const card = document.getElementById("card");
const nextButton = document.getElementById("next");
const searchButton = document.getElementById("search");
const status = document.getElementById("status");

function showMan() {
    document.getElementById("man").style.display = "block";
}

function showDriver() {
    document.getElementById("driver").style.display = "block";
}

function shake() {
    scene.classList.remove("shake");
    void scene.offsetWidth;
    scene.classList.add("shake");
}

function flash() {
    scene.classList.remove("flash");
    void scene.offsetWidth;
    scene.classList.add("flash");
}

function fallCard() {
    card.classList.add("fallen");
}

function next() {
    if (index >= scenes.length - 1) {
        return;
    }

    index++;

    const current = scenes[index];

    speaker.textContent = current.speaker;
    text.textContent = current.text;

    if (current.action) {
        current.action();
    }

    status.textContent = `語録 ${index + 1} / ${scenes.length}`;

    if (index === scenes.length - 1) {
        nextButton.textContent = "再生終了";
        nextButton.disabled = true;
    }
}

function findCard() {
    if (index < 2) {
        status.textContent = "まだカードは落ちていません。";
        return;
    }

    if (cardFound) {
        status.textContent = "カードはすでに見つかっています。";
        return;
    }

    if (!card.classList.contains("fallen")) {
        fallCard();
        status.textContent = "カードが落ちました。";
        return;
    }

    cardFound = true;
    card.classList.add("hidden");
    status.textContent = "カードを見つけました。";
    flash();
}

function reset() {
    index = -1;
    cardFound = false;

    speaker.textContent = "？？？";
    text.textContent = "画面を操作してください。";

    document.getElementById("man").style.display = "none";
    document.getElementById("driver").style.display = "none";

    card.classList.remove("fallen", "hidden");

    nextButton.disabled = false;
    nextButton.textContent = "次へ";

    status.textContent = "カードをクリックすることもできます。";
}

nextButton.addEventListener("click", next);
searchButton.addEventListener("click", findCard);
document.getElementById("restart").addEventListener("click", reset);

card.addEventListener("click", () => {
    fallCard();
    status.textContent = "カードを落としてしまった。";
});
</script>
</body>
</html>
